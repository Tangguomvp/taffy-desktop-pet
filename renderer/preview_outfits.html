<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>塔菲换装预览</title>
  <style>
    html, body { margin: 0; background: #1a1520; color: #f4e8d8; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
    .cell { position: relative; background: #2a2230; border-radius: 10px; overflow: hidden; height: 520px; }
    canvas { width: 100%; height: 100%; display: block; }
    .label { position: absolute; left: 10px; bottom: 10px; background: #0008; padding: 4px 10px; border-radius: 6px; font-size: 14px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "./vendor/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="grid"></div>
  <script type="module">
    import * as THREE from "three";
    import { MMDLoader } from "three/addons/loaders/MMDLoader.js";

    const outfits = [
      { name: "1883 藏青", url: new URL("../models/taffy1883/taffy.pmx", import.meta.url).href },
      { name: "JK 水手服", url: new URL("../models/pmx/nurse/taffy.pmx", import.meta.url).href },
      { name: "JSK 郊游裙", url: new URL("../models/pmx/outing/taffy.pmx", import.meta.url).href },
      { name: "洛丽塔女仆", url: new URL("../models/pmx/maid/taffy.pmx", import.meta.url).href },
      { name: "洛丽塔圣诞", url: new URL("../models/pmx/xmas/taffy.pmx", import.meta.url).href },
    ];

    const loader = new MMDLoader();
    const grid = document.getElementById("grid");

    function makeView(title) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const canvas = document.createElement("canvas");
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = title;
      cell.appendChild(canvas);
      cell.appendChild(label);
      grid.appendChild(cell);
      return canvas;
    }

    async function renderOne(spec) {
      const canvas = makeView("加载中 " + spec.name);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(360, 520, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x6a5a68, 1);
      const scene = new THREE.Scene();
      scene.add(new THREE.AmbientLight(0xfff4ea, 0.95));
      scene.add(new THREE.HemisphereLight(0xffe8d8, 0x7a5360, 1.3));
      const key = new THREE.DirectionalLight(0xfff3e8, 1.6);
      key.position.set(-6, 18, 14);
      scene.add(key);
      const camera = new THREE.PerspectiveCamera(28, 360 / 520, 0.1, 1000);
      camera.position.set(0, 13.2, 28);
      camera.lookAt(0, 10.4, 0);
      try {
        const mesh = await new Promise((res, rej) => loader.load(spec.url, res, undefined, rej));
        mesh.position.set(0, 0, 0);
        mesh.frustumCulled = false;
        mesh.traverse((obj) => {
          if (obj.isMesh) {
            obj.frustumCulled = false;
            obj.material = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });
          }
        });
        mesh.updateMatrixWorld(true);
        if (mesh.skeleton) {
          mesh.skeleton.bones.forEach((b) => b.updateMatrixWorld());
          mesh.skeleton.update();
        }
        scene.add(mesh);
        const box = new THREE.Box3().setFromObject(mesh);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const fov = (camera.fov * Math.PI) / 180;
        const dist = Math.max((size.y * 0.9) / Math.tan(fov / 2), 12);
        camera.position.set(center.x, center.y + size.y * 0.08, dist);
        camera.lookAt(center.x, center.y + size.y * 0.05, 0);
        renderer.render(scene, camera);
        canvas.parentElement.querySelector(".label").textContent =
          spec.name + " " + Math.round(size.y * 10) / 10 + "h";
      } catch (err) {
        canvas.parentElement.querySelector(".label").textContent = spec.name + " 失败 " + (err && err.message);
        console.error(spec.name, err);
      }
    }

    for (const o of outfits) await renderOne(o);
    document.title = "preview-ready";
  </script>
</body>
</html>
