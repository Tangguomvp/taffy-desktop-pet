<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data: file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>塔菲动作预览</title>
  <style>
    html, body { margin: 0; background: #18131d; color: #f7edf2; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
    .cell { position: relative; height: 520px; overflow: hidden; border-radius: 12px; background: #6a5a68; }
    canvas { width: 100%; height: 100%; display: block; }
    .label { position: absolute; left: 12px; bottom: 12px; padding: 5px 12px; border-radius: 999px; background: #1d1524cc; font-size: 15px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "./vendor/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="grid"></div>
  <script type="module">
    import * as THREE from "three";
    import { MMDLoader } from "three/addons/loaders/MMDLoader.js";
    import { ACTIONS, actionById } from "./actions.mjs";
    import { pickByAliasPriority } from "./motion.mjs";
    import { PREVIEW_PHASES, applyMotionPose, previewElapsed, sampleActionPose } from "./pose.mjs";

    const modelUrl = new URL("../models/taffy1883/taffy.pmx", import.meta.url).href;
    const validationOutfits = [
      ["1883", modelUrl],
      ["nurse", new URL("../models/pmx/nurse/taffy.pmx", import.meta.url).href],
      ["outing", new URL("../models/pmx/outing/taffy.pmx", import.meta.url).href],
      ["maid", new URL("../models/pmx/maid/taffy.pmx", import.meta.url).href],
      ["xmas", new URL("../models/pmx/xmas/taffy.pmx", import.meta.url).href],
    ];
    const loader = new MMDLoader();
    const grid = document.getElementById("grid");
    // ?skin=1 时用模型真实贴图渲染，方便检查手有没有穿进脸/身体
    const skinMode = new URLSearchParams(location.search).get("skin") || "0";
    const useSkin = skinMode !== "0";
    // ?only=wave,jump 只渲染指定动作，方便逐个放大检查
    const onlyIds = (new URLSearchParams(location.search).get("only") || "").split(",").filter(Boolean);
    const previewActions = onlyIds.length ? ACTIONS.filter((spec) => onlyIds.includes(spec.id)) : ACTIONS;

    const getBone = (mesh, ...names) => pickByAliasPriority(mesh.skeleton.bones, names);

    const requiredBoneGroups = [
      ["頭", "头", "Head"],
      ["上半身"],
      ["センター", "センター2"],
      ["右腕D"],
      ["左腕D"],
      ["右ひじD"],
      ["左ひじD"],
      ["右足D", "右足", "右腿", "RightLeg"],
      ["左足D", "左足", "左腿", "LeftLeg"],
      ["右ひざD", "右ひざ", "右膝", "RightKnee"],
      ["左ひざD", "左ひざ", "左膝", "LeftKnee"],
    ];

    function snapshotPose(mesh) {
      return {
        position: mesh.position.clone(),
        quaternion: mesh.quaternion.clone(),
        bones: mesh.skeleton.bones.map((bone) => ({
          bone,
          position: bone.position.clone(),
          quaternion: bone.quaternion.clone(),
        })),
      };
    }

    function restorePose(mesh, snapshot) {
      mesh.position.copy(snapshot.position);
      mesh.quaternion.copy(snapshot.quaternion);
      for (const item of snapshot.bones) {
        item.bone.position.copy(item.position);
        item.bone.quaternion.copy(item.quaternion);
      }
      mesh.updateMatrixWorld(true);
      mesh.skeleton.update();
    }

    function assertFinitePose(mesh, outfit, kind) {
      const values = [
        ...mesh.position.toArray(),
        ...mesh.quaternion.toArray(),
        ...mesh.skeleton.bones.flatMap((bone) => [
          ...bone.position.toArray(),
          ...bone.quaternion.toArray(),
        ]),
      ];
      if (!values.every(Number.isFinite)) {
        throw new Error(outfit + "/" + kind + ": non-finite bone transform");
      }
    }

    function assertRestoredPose(mesh, snapshot, outfit) {
      const epsilon = 1e-7;
      if (
        mesh.position.distanceTo(snapshot.position) > epsilon ||
        1 - Math.abs(mesh.quaternion.dot(snapshot.quaternion)) > epsilon
      ) {
        throw new Error(outfit + ": mesh did not return to rest");
      }
      for (const item of snapshot.bones) {
        if (
          item.bone.position.distanceTo(item.position) > epsilon ||
          1 - Math.abs(item.bone.quaternion.dot(item.quaternion)) > epsilon
        ) {
          throw new Error(outfit + ": bone " + item.bone.name + " did not return to rest");
        }
      }
    }

    function poseFor(spec) {
      const phase = PREVIEW_PHASES[spec.id] ?? 0.5;
      return sampleActionPose(spec, previewElapsed(spec, phase), 1.25);
    }

    // 每种动作必须真的驱动到对应骨骼，避免"菜单有动作但模型没反应"
    function assertMotionReached(mesh, spec, before, outfit) {
      const moved = (...aliases) => {
        const bone = getBone(mesh, ...aliases);
        if (!bone) return false;
        const prev = before.get(bone);
        return prev ? 1 - Math.abs(prev.dot(bone.quaternion)) > 1e-6 : true;
      };
      if (spec.kind === "gesture") {
        const motion = poseFor(spec).gesture;
        if ((motion.weight || 0) > 0.5) {
          if (!moved("右腕D")) throw new Error(outfit + "/" + spec.id + ": right arm did not follow the gesture");
          if (spec.gesture !== "touchFace" && spec.gesture !== "wave" && !moved("左腕D")) {
            throw new Error(outfit + "/" + spec.id + ": left arm did not follow the gesture");
          }
        }
      } else if (spec.kind === "walk" || spec.kind === "stomp" || spec.kind === "body") {
        // 身体动作不一定动腿（点头/摇头/歪头只动头和躯干），但必须动到点什么
        if (!moved("右足D", "右足", "右腿", "RightLeg") && !moved("頭", "头", "Head")) {
          throw new Error(outfit + "/" + spec.id + ": nothing moved");
        }
      } else if (spec.kind === "spin") {
        if (Math.abs(mesh.rotation.y) < 1e-3) throw new Error(outfit + "/" + spec.id + ": model did not turn");
      } else if (spec.kind === "idle") {
        if (!getBone(mesh, "頭", "头", "Head")) throw new Error(outfit + ": missing head bone");
      }
    }

    async function validateOutfit(name, url) {
      const mesh = await new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
      const missing = requiredBoneGroups
        .filter((names) => !getBone(mesh, ...names))
        .map((names) => names.join("/"));
      if (missing.length) throw new Error(name + ": missing bones " + missing.join(", "));
      const rest = snapshotPose(mesh);
      for (const spec of previewActions) {
        restorePose(mesh, rest);
        const before = new Map();
        for (const bone of [getBone(mesh, "右腕D"), getBone(mesh, "左腕D"), getBone(mesh, "右足D", "右足", "右腿", "RightLeg")]) {
          if (bone) before.set(bone, bone.quaternion.clone());
        }
        applyMotionPose(mesh, poseFor(spec));
        assertFinitePose(mesh, name, spec.id);
        assertMotionReached(mesh, spec, before, name);
      }
      restorePose(mesh, rest);
      assertFinitePose(mesh, name, "restored");
      assertRestoredPose(mesh, rest, name);
    }

    function makeCell(label) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const canvas = document.createElement("canvas");
      const tag = document.createElement("div");
      tag.className = "label";
      tag.textContent = label;
      cell.append(canvas, tag);
      grid.appendChild(cell);
      return canvas;
    }

    async function renderPose(label, spec) {
      const canvas = makeCell(label);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(400, 640, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x6a5a68, 1);
      const scene = new THREE.Scene();
      scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const key = new THREE.DirectionalLight(0xffe9ef, 1.6);
      key.position.set(-6, 18, 14);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xbad8ff, 0.65);
      rim.position.set(8, 10, -8);
      scene.add(rim);

      const mesh = await new Promise((resolve, reject) => loader.load(modelUrl, resolve, undefined, reject));
      mesh.traverse((object) => {
        if (object.isMesh) {
          object.frustumCulled = false;
          if (skinMode === "2") {
            object.material = new THREE.MeshPhongMaterial({ color: 0xffc0d0, side: THREE.DoubleSide, shininess: 12 });
          } else {
            object.material = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });
          }
        }
      });
      scene.add(mesh);
      applyMotionPose(mesh, poseFor(spec));

      const box = new THREE.Box3().setFromObject(mesh);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const camera = new THREE.PerspectiveCamera(28, 400 / 640, 0.1, 1000);
      const distance = Math.max((size.y * 0.9) / Math.tan((camera.fov * Math.PI) / 360), 12);
      camera.position.set(center.x, center.y + size.y * 0.06, distance);
      camera.lookAt(center.x, center.y + size.y * 0.04, 0);
      renderer.render(scene, camera);
    }

    try {
      for (const spec of previewActions) await renderPose(spec.name, spec);
      for (const [name, url] of validationOutfits) await validateOutfit(name, url);
      window.actionValidation = { outfits: validationOutfits.length, poses: previewActions.length };
      window.__ACTION_PREVIEW_RESULT__ = window.actionValidation;
      console.info("validated " + validationOutfits.length + " outfits x " + previewActions.length + " poses");
      document.title = "preview-actions-ready";
    } catch (error) {
      window.actionValidationError = error?.stack || error?.message || String(error);
      console.error(window.actionValidationError);
      document.title = "preview-actions-error";
    }
  </script>
</body>
</html>
