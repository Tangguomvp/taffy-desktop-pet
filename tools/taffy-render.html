<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>taffy-render</title>
  <style>html,body{margin:0;padding:0;background:#18131d;overflow:hidden}</style>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="cv" width="480" height="768"></canvas>
  <div id="label" style="position:absolute;left:18px;bottom:18px;padding:8px 18px;border-radius:999px;background:rgba(20,14,24,.82);color:#f7edf2;font:600 22px 'Segoe UI','Microsoft YaHei',sans-serif;letter-spacing:.06em"></div>
  <script type="module">
    import * as THREE from "three";
    import { MMDLoader } from "../renderer/vendor/jsm/loaders/MMDLoader.js";
    import { actionById } from "../renderer/actions.mjs";

    const resolveSpec = (id) => actionById(id);
    import { applyMotionPose, sampleActionPose } from "../renderer/pose.mjs";
    import { pickByAliasPriority, setLegRig } from "../renderer/motion.mjs";

    const FPS = 30;
    const W = 480;
    const H = 768;
    const canvas = document.getElementById("cv");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x18131d, 1);

    // 灯光对齐桌宠本体：环境光压低一点，颜色才不会发白
    const scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const key = new THREE.DirectionalLight(0xfff2f5, 1.55);
    key.position.set(-6, 18, 14);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xbad8ff, 0.5);
    rim.position.set(8, 10, -8);
    scene.add(rim);

    let mesh = null;
    let camera = null;
    const boneAny = (...names) => (mesh ? pickByAliasPriority(mesh.skeleton.bones, names) : null);

    function fitCamera() {
      mesh.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(mesh);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 1000);
      // 跳跃 / 伸懒腰会把手脚抬出静止包围盒，留 10% 余量避免出画
      const distance = Math.max((size.y * 0.92) / Math.tan((camera.fov * Math.PI) / 360), 12) * 1.09;
      camera.position.set(center.x, center.y + size.y * 0.03, distance);
      camera.lookAt(center.x, center.y + size.y * 0.03, 0);
    }

    // WebGL canvas 只有画面没有文字，标签要另画一层 2D 合成
    const frameCanvas = document.createElement("canvas");
    frameCanvas.width = W;
    frameCanvas.height = H;
    const ctx = frameCanvas.getContext("2d");

    function composeFrame(id) {
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(canvas, 0, 0, W, H);
      const spec = resolveSpec(id);
      const text = spec ? spec.name : "";
      if (!text) return;
      ctx.font = "600 26px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      const width = ctx.measureText(text).width + 40;
      const x = 18;
      const y = H - 30 - 46;
      ctx.fillStyle = "rgba(20, 14, 24, 0.82)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, width, 46, 23);
      else ctx.rect(x, y, width, 46);
      ctx.fill();
      ctx.fillStyle = "#f7edf2";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + 20, y + 24);
    }

    function drawFrame(id, tMs) {
      if (!mesh) return false;
      const spec = resolveSpec(id) || { id: "idle", kind: "idle", name: "自然待机" };
      applyMotionPose(mesh, sampleActionPose(spec, tMs / 1000, tMs / 1000));
      renderer.render(scene, camera);
      composeFrame(id);
      return true;
    }

    window.__render = (id, tMs) => drawFrame(id, tMs);
    window.__label = (id) => {
      const spec = resolveSpec(id);
      document.getElementById("label").textContent = spec ? spec.name : "";
      return true;
    };

    // 整个序列同步渲染成 JPEG 帧（toDataURL），避免逐帧截图的时序问题
    window.__renderAll = async (list) => {
      const out = [];
      for (const [id, durMs] of list) {
        const spec = resolveSpec(id);
        document.getElementById("label").textContent = spec ? spec.name : "";
        const frames = Math.max(1, Math.round((durMs / 1000) * FPS));
        for (let f = 0; f < frames; f++) {
          drawFrame(id, (f / FPS) * 1000);
          out.push(frameCanvas.toDataURL("image/jpeg", 0.9));
          if (out.length % 15 === 0) {
            console.log("render progress", out.length, "frames");
            await new Promise((r) => setTimeout(r, 0));
          }
        }
      }
      console.log("render all done", out.length);
      return out;
    };
    window.__snap = () => frameCanvas.toDataURL("image/jpeg", 0.6);

    const loader = new MMDLoader();
    loader.load(
      new URL("../models/taffy1883/taffy.pmx", import.meta.url).href,
      (object) => {
        mesh = object;
        scene.add(mesh);
        const legB = boneAny("右足D", "右足", "右腿", "RightLeg");
        const kneeB = boneAny("右ひざD", "右ひざ", "右膝", "RightKnee");
        const ankleB = boneAny("右足首D", "右足首", "右脚踝", "RightAnkle");
        if (legB && kneeB && ankleB) setLegRig(kneeB.position.length(), ankleB.position.length());
        fitCamera();
        document.title = "render-ready";
      },
      undefined,
      (err) => { document.title = "render-error:" + (err?.message || err); }
    );
  </script>
</body>
</html>
