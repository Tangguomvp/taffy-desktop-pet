<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>塔菲动作预览（侧视火柴人）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0e1117; color: #e6edf3;
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; gap: 18px; padding: 18px; min-height: 100vh;
  }
  .stage { background: #131820; border: 1px solid #232c3b; border-radius: 12px; padding: 8px; }
  canvas { display: block; border-radius: 8px; }
  .panel { width: 320px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .hint { color: #8b98a9; font-size: 12px; margin: 0 0 4px; }
  .group { background: #131820; border: 1px solid #232c3b; border-radius: 12px; padding: 12px; }
  .group h2 { font-size: 12px; letter-spacing: .08em; color: #8b98a9; margin: 0 0 8px; text-transform: uppercase; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    background: #1d2735; color: #e6edf3; border: 1px solid #2b3646;
    border-radius: 7px; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:hover { background: #263248; }
  button.on { background: #2f6feb; border-color: #2f6feb; }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  input[type=range] { flex: 1; accent-color: #2f6feb; }
  .readout { font: 12px/1.7 ui-monospace, Consolas, monospace; color: #9fb0c6; white-space: pre; }
  .readout b { color: #e6edf3; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #8b98a9; margin-top: 6px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
</style>
</head>
<body>
  <div class="stage"><canvas id="cv" width="440" height="430"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:#5aa9ff"></i>新曲线</span>
      <span><i class="dot" style="background:#5d6b7f"></i>旧曲线（虚线）</span>
      <span><i class="dot" style="background:#f0a13c"></i>重心投影</span>
    </div>
  </div>
  <div class="panel">
    <div>
      <h1>塔菲动作预览</h1>
      <p class="hint">侧视图按真实骨骼角度驱动：髋 → 膝 → 踝，肩 → 肘。虚线是改之前的动作，用来对照。</p>
    </div>
    <div class="group">
      <h2>动作</h2>
      <div class="btns" id="actions"></div>
    </div>
    <div class="group">
      <h2>播放</h2>
      <label><input type="range" id="seek" min="0" max="1000" value="0" /><span id="seekVal">0%</span></label>
      <div class="btns" style="margin-top:8px">
        <button id="play">暂停</button>
        <button data-speed="0.25">0.25x</button>
        <button data-speed="0.5">0.5x</button>
        <button data-speed="1" class="on">1x</button>
      </div>
      <label style="margin-top:8px"><input type="checkbox" id="ghost" checked /> 显示旧动作对照</label>
      <label><input type="checkbox" id="floor" checked /> 显示地面与重心</label>
    </div>
    <div class="group">
      <h2>通道数值</h2>
      <div class="readout" id="readout"></div>
    </div>
  </div>

<script type="module">
// 动作曲线。所有离散动作都遵循同一套人体运动学：
//   预备(anticipation) → 主动作 → 跟随(follow-through) → 缓冲吸收(landing) → 回正
// 每个通道在 p=0 与 p=1 必须精确归零，否则动作之间会出现跳变。
const clamp01 = (value) => Math.max(0, Math.min(1, Number(value) || 0));

const smootherstep = (value) => {
  const x = clamp01(value);
  return x * x * x * (x * (x * 6 - 15) + 10);
};

// 加速：重力 / 爆发起跳用，位移集中在末段
const easeInCubic = (value) => {
  const x = clamp01(value);
  return x * x * x;
};

// 减速：冲击吸收 / 到位停顿用，位移集中在前段
const easeOutCubic = (value) => {
  const x = clamp01(value);
  return 1 - (1 - x) ** 3;
};

const easeInOutCubic = (value) => {
  const x = clamp01(value);
  return x < 0.5 ? 4 * x * x * x : 1 - ((-2 * x + 2) ** 3) / 2;
};

// 转动用正弦缓动：两端速度归零，中段比 cubic 平缓，读起来是"转"而不是"甩"
const easeInOutSine = (value) => {
  const x = clamp01(value);
  return 0.5 - Math.cos(Math.PI * x) / 2;
};

// 高斯冲击：触地瞬间最强，之后快速衰减，并带一次反向余震
const gauss = (x, mu, sigma) => Math.exp(-(((x - mu) / sigma) ** 2));

// 周期性关键帧曲线（Catmull-Rom，切线按区间宽度缩放）
function makeCurve(keys) {
  const pts = keys.slice().sort((a, b) => a[0] - b[0]);
  const n = pts.length;
  const spanAt = (i) => {
    const a = pts[i][0];
    const b = pts[(i + 1) % n][0];
    return b > a ? b - a : b + 1 - a;
  };
  return (u) => {
    const x = ((u % 1) + 1) % 1;
    let seg = -1;
    for (let k = 0; k < n; k++) {
      let d = x - pts[k][0];
      if (d < 0) d += 1;
      if (d <= spanAt(k)) {
        seg = k;
        break;
      }
    }
    if (seg < 0) seg = n - 1;
    const width = spanAt(seg);
    let d = x - pts[seg][0];
    if (d < 0) d += 1;
    const t = width > 1e-6 ? Math.min(1, d / width) : 0;
    const v0 = pts[(seg - 1 + n) % n][1];
    const v1 = pts[seg][1];
    const v2 = pts[(seg + 1) % n][1];
    const v3 = pts[(seg + 2) % n][1];
    const m1 = ((v2 - v0) / 2) * width;
    const m2 = ((v3 - v1) / 2) * width;
    const t2 = t * t;
    const t3 = t2 * t;
    return (
      (2 * t3 - 3 * t2 + 1) * v1 +
      (t3 - 2 * t2 + t) * m1 +
      (-2 * t3 + 3 * t2) * v2 +
      (t3 - t2) * m2
    );
  };
}

// 腿长（模型单位）。真实值在绑定骨骼时由 pet.js 写入；缺省按常见 PMX 比例估。
const legRig = { upper: 3.5, lower: 3.5 };

export function setLegRig(upper, lower) {
  if (Number.isFinite(Number(upper)) && Number(upper) > 0.2) legRig.upper = Number(upper);
  if (Number.isFinite(Number(lower)) && Number(lower) > 0.2) legRig.lower = Number(lower);
}

export function getLegRig() {
  return { upper: legRig.upper, lower: legRig.lower };
}

// 让某条腿的脚底留在地面上、重心必须落到的高度（相对站直时，恒为负或 0）。
// center 骨骼与脚同高，所以 bodyY = drop - rest 时脚底正好贴地。
export function groundedCenterY(hip, knee) {
  const rest = legRig.upper + legRig.lower;
  return (
    legRig.upper * Math.cos(hip) + legRig.lower * Math.cos(hip + knee) - rest
  );
}

// 两条腿里更伸直的那条会把身体撑住，另一条自然离地——取 max 才对。
// 想让脚离地（腾空 / 抬腿），在结果上再加一个 air 高度。
export function plantedCenterY(hipR, kneeR, hipL, kneeL) {
  return Math.max(groundedCenterY(hipR, kneeR), groundedCenterY(hipL, kneeL));
}

export function pickByAliasPriority(items, names) {
  for (const name of names || []) {
    const match = (items || []).find((item) => item?.name === name);
    if (match) return match;
  }
  return null;
}

export function facingYawForDirection(direction, blend = 1) {
  if ((Number(blend) || 0) <= 0.001) return 0;
  return direction < 0 ? -0.38 : 0.38;
}

export function canStartAction(active, requested) {
  const state = active || {};
  const spin = Boolean(state.spin);
  const gesture = Boolean(state.gesture);
  const stomp = Boolean(state.stomp);
  const walk = Boolean(state.walk);
  if (requested === "spin") return !spin && !gesture && !stomp && !walk;
  if (requested === "gesture") return !spin && !gesture && !stomp && !walk;
  if (requested === "stomp") return !spin && !gesture && !stomp && !walk;
  if (requested === "walk") return !walk && !spin && !gesture && !stomp;
  return false;
}

export function phaseEnvelope(progress, attackEnd = 0.28, releaseStart = 0.72) {
  const p = clamp01(progress);
  const attack = Math.max(0.001, Math.min(attackEnd, 0.999));
  const release = Math.max(attack, Math.min(releaseStart, 0.999));
  if (p <= 0 || p >= 1) return 0;
  if (p < attack) return smootherstep(p / attack);
  if (p <= release) return 1;
  return smootherstep((1 - p) / (1 - release));
}

function mixPose(a, b, t) {
  const u = clamp01(t);
  const out = {};
  for (const key of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    out[key] = (a[key] || 0) * (1 - u) + (b[key] || 0) * u;
  }
  return out;
}

export function sampleIdleMotion(seconds) {
  const t = Number(seconds) || 0;
  const breath = Math.sin(t * 1.72) * 0.012;
  const weightShift = Math.sin(t * 0.61 + 0.45);
  return {
    breath,
    centerY: Math.sin(t * 1.72 - 0.35) * 0.026,
    bodyX: weightShift * 0.018,
    bodyZ: weightShift * 0.028 + Math.sin(t * 1.13) * 0.009,
    headX: Math.sin(t * 0.49 + 0.35) * 0.018,
    headY: Math.sin(t * 0.43 + 0.8) * 0.055 + Math.sin(t * 0.91) * 0.012,
    headZ: -weightShift * 0.024 + Math.sin(t * 0.31 + 1.1) * 0.009,
    armR: Math.sin(t * 0.82 + 0.3) * 0.075 + Math.sin(t * 0.37) * 0.018,
    armL: -Math.sin(t * 0.82 + 0.3) * 0.062 + Math.sin(t * 0.53 + 1.2) * 0.023,
  };
}

// ---------------------------------------------------------------------------
// 张臂转圈：反向扭身蓄势 → 张臂起转 → 空中旋转（收一条腿）→ 落地下蹲卸力 → 收臂回正
// 旋转靠手臂张开起势、靠落地屈膝收势，中间是匀速偏减速的转动。
// ---------------------------------------------------------------------------

export function sampleSpinMotion(progress) {
  const p = clamp01(progress);
  const prepEnd = 0.12;
  const airEnd = 0.76;
  const settleEnd = 0.9;

  if (p <= prepEnd) {
    // 预备：身体先朝反方向拧一点，重心下沉，手臂收在身侧
    const prep = smootherstep(p / prepEnd);
    return {
      turns: -0.055 * prep,
      centerY: plantedCenterY(0.07 * prep, -0.12 * prep, 0, 0),
      bodyX: 0.05 * prep,
      bodyZ: -0.04 * prep,
      armOpen: 0.12 * prep,
      legR: 0.07 * prep,
      legRZ: -0.03 * prep,
      kneeR: -0.12 * prep,
      footR: 0.03 * prep,
      legL: 0,
      kneeL: 0,
      footL: 0,
    };
  }

  if (p < airEnd) {
    const travel = (p - prepEnd) / (airEnd - prepEnd);
    const arc = Math.sin(travel * Math.PI);
    // 起转靠躯干回弹带一点初速度，之后按正弦收速，停的时候不会硬刹
    const turnEase = 0.15 * travel + 0.85 * easeInOutSine(travel);
    const liftR = 0.52 * arc;
    const liftL = -0.07 * arc;
    return {
      turns: -0.055 + 1.055 * turnEase,
      // 支撑腿（左腿几乎伸直）决定身体高度，抬起的右腿自然离地
      centerY: plantedCenterY(liftR, -0.95 * arc, liftL, -0.12 * arc) + 1.05 * arc,
      bodyX: 0.08 * arc * Math.cos(travel * Math.PI * 2),
      bodyZ: -0.085 * arc,
      // 手臂在起转阶段就完全张开（产生角动量），落地前才开始收
      armOpen: Math.min(1, smootherstep(travel / 0.3)),
      legR: 0.52 * arc,
      legRZ: -0.26 * arc,
      kneeR: -0.95 * arc,
      footR: 0.18 * arc,
      legL: -0.07 * arc,
      kneeL: -0.12 * arc,
      footL: 0.05 * arc,
    };
  }

  if (p < settleEnd) {
    // 接地：重心继续下沉到最低点，抬起的腿放下并屈膝吸收冲击
    const u = (p - airEnd) / (settleEnd - airEnd);
    const drop = easeOutCubic(u);
    // 双腿对称屈膝，脚才会一起踩到地上；一腿弯一腿直会变成单腿站立
    const bend = -0.52 * drop;
    const swing = 0.06 * Math.sin(Math.PI * u);
    return {
      turns: 1,
      centerY: groundedCenterY(swing, bend),
      bodyX: 0.05 * Math.sin(Math.PI * u),
      bodyZ: 0.03 * drop,
      // 接地的瞬间手臂还在张开，落地过程中自然垂下收拢
      armOpen: 1 - smootherstep(u),
      // 接地的腿先向前探一点再收回站直，避免"腿凭空消失"
      legR: swing,
      legRZ: -0.05 * Math.sin(Math.PI * u),
      kneeR: bend,
      footR: 0.05 * Math.sin(Math.PI * u),
      legL: swing,
      kneeL: bend,
      footL: 0,
    };
  }

  // 站直回正
  const u = (p - settleEnd) / (1 - settleEnd);
  const rise = smootherstep(u);
  const bend = -0.52 * (1 - rise);
  return {
    turns: 1,
    centerY: groundedCenterY(0, bend),
    bodyX: 0,
    bodyZ: 0.03 * (1 - rise),
    armOpen: 0,
    legR: 0,
    legRZ: 0,
    kneeR: bend,
    footR: 0,
    legL: 0,
    kneeL: bend,
    footL: 0,
  };
}

// ---------------------------------------------------------------------------
// 害羞摸脸：抬手走弧线 → 迟疑一下 → 轻抚（手在动、头保持）→ 手先撤 → 头再回
// 手和头不同步是"活"的关键：手走完一半头才开始偏，手已经撤了头还停在原地。
// ---------------------------------------------------------------------------

export function sampleTouchFaceMotion(progress) {
  const p = clamp01(progress);
  const weight = phaseEnvelope(p, 0.26, 0.7);
  // 手的权重（领先）：起落都比头早
  const handLead = phaseEnvelope(p, 0.24, 0.72);
  // 头的权重（滞后）：起得晚、收得晚
  const headLag = phaseEnvelope(Math.max(0, (p - 0.06) / 0.94), 0.3, 0.62);

  if (weight === 0 && handLead === 0 && headLag === 0) {
    return { weight: 0, targetXOffset: 0, targetYOffset: 0, headX: 0, headY: 0, headZ: 0, bodyX: 0, bodyZ: 0 };
  }

  const approach = Math.sin(Math.min(1, p / 0.26) * Math.PI);
  // 轻抚：主频 + 呼吸频叠加，避免机械的单频正弦
  const caressT = Math.max(0, Math.min(1, (p - 0.3) / 0.42));
  const caress = caressT > 0 && caressT < 1 ? Math.sin(caressT * Math.PI * 2) * 0.045 : 0;
  const breath = Math.sin(p * Math.PI * 5) * 0.012;
  // 抬手中段一次极轻的迟疑（害羞会先缩一下再贴上）
  const hesitate = Math.sin(Math.min(1, Math.max(0, (p - 0.2) / 0.1)) * Math.PI) * -0.05;

  return {
    weight: handLead,
    targetXOffset: -0.12 * approach * handLead + hesitate * handLead,
    targetYOffset: (0.07 + caress + breath) * handLead,
    headX: 0.03 * headLag,
    headY: 0.05 * headLag,
    headZ: -0.08 * headLag,
    bodyX: 0.012 * headLag,
    bodyZ: -0.028 * headLag,
  };
}

// ---------------------------------------------------------------------------
// 跺脚：重心移到支撑腿 → 抬腿蓄势 → 重力加速下踩 → 触地冲击 + 余震 → 回正
// ---------------------------------------------------------------------------

const stompRestPose = () => ({
  centerX: 0,
  centerY: 0,
  bodyX: 0,
  bodyZ: 0,
  headX: 0,
  headZ: 0,
  upperY: 0,
  lowerY: 0,
  legR: 0,
  legL: 0,
  legRZ: 0,
  legLZ: 0,
  legRX: 0,
  legRY: 0,
  legLX: 0,
  legLY: 0,
  kneeR: 0,
  kneeL: 0,
  ankleR: 0,
  ankleL: 0,
  footR: 0,
  footL: 0,
  armR: 0,
  armL: 0,
  impact: 0,
});

export function sampleStompMotion(progress) {
  const p = clamp01(progress);
  if (p <= 0 || p >= 1) return stompRestPose();

  const rest = stompRestPose();
  // A 抬腿：重心先挪到支撑腿上，抬起的膝盖收在身前
  const raised = {
    centerX: -0.075,

    bodyX: 0.045,
    bodyZ: -0.055,
    headX: -0.02,
    headZ: 0.025,
    upperY: 0.045,
    lowerY: -0.05,
    // Positive hip X lifts the thigh forward; bent knee keeps the foot under
    // the skirt. Do not translate D-bones — that detaches the visible foot.
    legR: 0.55,
    legL: 0.05,
    legRZ: -0.07,
    legLZ: 0.03,
    legRX: 0,
    legRY: 0,
    legLX: 0,
    legLY: 0,
    kneeR: -1.1,
    kneeL: 0.05,
    ankleR: 0.2,
    ankleL: 0,
    footR: 0.24,
    footL: 0.02,
    armR: 0.34,
    armL: -0.28,
    impact: 0,
  };
  // C 下踩到底：腿已经伸出去，脚掌朝下准备拍地
  const strike = {
    centerX: -0.02,

    bodyX: 0.02,
    bodyZ: -0.02,
    headX: 0.01,
    headZ: 0.01,
    upperY: 0.02,
    lowerY: -0.02,
    legR: 0.05,
    legL: 0.02,
    legRZ: -0.02,
    legLZ: 0.01,
    legRX: 0,
    legRY: 0,
    legLX: 0,
    legLY: 0,
    kneeR: -0.12,
    kneeL: 0.03,
    ankleR: 0.06,
    ankleL: 0,
    footR: -0.12,
    footL: 0.01,
    armR: 0.16,
    armL: -0.2,
    impact: 0,
  };
  // D 触地：身体被压下去，支撑腿弯曲，冲击沿着躯干传到头上
  const planted = {
    centerX: 0.045,

    bodyX: -0.05,
    bodyZ: 0.045,
    headX: 0.05,
    headZ: -0.03,
    upperY: -0.035,
    lowerY: 0.035,
    legR: 0.04,
    legL: -0.02,
    legRZ: 0.02,
    legLZ: -0.01,
    legRX: 0,
    legRY: 0,
    legLX: 0,
    legLY: 0,
    // 双腿对称屈膝吸收冲击——靠膝盖弯而不是把中心往地里压
    kneeR: -0.38,
    kneeL: -0.38,
    ankleR: 0.05,
    ankleL: 0,
    footR: 0.08,
    footL: -0.02,
    armR: -0.15,
    armL: 0.13,
    impact: 0,
  };
  // E 余震回弹：身体弹起来一点再落回站姿
  const recoil = {
    centerX: -0.015,

    bodyX: -0.02,
    bodyZ: 0.018,
    headX: 0.015,
    headZ: -0.012,
    upperY: -0.012,
    lowerY: 0.012,
    legR: 0.02,
    legL: 0,
    legRZ: 0.01,
    legLZ: 0,
    legRX: 0,
    legRY: 0,
    legLX: 0,
    legLY: 0,
    kneeR: -0.03,
    kneeL: -0.05,
    ankleR: 0.02,
    ankleL: 0,
    footR: 0.03,
    footL: 0,
    armR: -0.06,
    armL: 0.05,
    impact: 0,
  };

  let pose;
  if (p < 0.28) pose = mixPose(rest, raised, smootherstep(p / 0.28));
  else if (p < 0.34) pose = { ...raised };
  else if (p < 0.44) pose = mixPose(raised, strike, easeInCubic((p - 0.34) / 0.1));
  else if (p < 0.62) pose = mixPose(strike, planted, easeOutCubic((p - 0.44) / 0.18));
  else if (p < 0.78) pose = mixPose(planted, recoil, smootherstep((p - 0.62) / 0.16));
  else pose = mixPose(recoil, rest, smootherstep((p - 0.78) / 0.22));

  // 重心由支撑腿的几何决定，抬起的右腿自然离地
  pose.centerY = plantedCenterY(pose.legR, pose.kneeR, pose.legL, pose.kneeL);
  // 冲击：触地那一瞬最强，随后一次反向余震。只用于头和上半身的抖动，
  // 下蹲吸收已经由膝盖弯曲承担，不再额外把重心往地里压（否则脚会穿地）
  pose.impact = gauss(p, 0.44, 0.045) - 0.28 * gauss(p, 0.54, 0.05);
  pose.headX += 0.05 * pose.impact;
  pose.upperY -= 0.03 * pose.impact;
  return pose;
}

// ---------------------------------------------------------------------------
// 走动：标准步态周期
//   支撑期 = 脚跟着地 → 承重 → 蹬离（腿从最前走到最后）
//   摆动期 = 折叠前摆 → 伸直到脚跟着地（腿从最后走到最前）
// 关键是被忽略的三件事：支撑腿落地会弯一下再蹬直、摆动腿脚尖要上翘、
// 重心在双腿支撑时最低、单腿支撑时最高，并且始终偏向支撑腿那一侧。
// ---------------------------------------------------------------------------

export const WALK_STEP_RATE = 2.2; // 步/秒

// 右膝：u = 0 摆动中期（最大屈曲）→ 0.25 脚跟着地 → 0.5 单腿支撑中期 → 0.75 蹬离 → 回到 0
// 摆动期屈曲收到 0.78/0.75，避免脚后跟抬得过高从裙摆下方穿出。
const KNEE_CURVE = makeCurve([
  [0.0, 0.78],
  [0.25, 0.09],
  [0.35, 0.3],
  [0.5, 0.07],
  [0.65, 0.05],
  [0.75, 0.35],
  [0.9, 0.75],
]);

// 右踝：负 = 脚尖上翘（背屈），正 = 脚掌下踩（跖屈）
const ANKLE_CURVE = makeCurve([
  [0.0, -0.18],
  [0.18, -0.06],
  [0.25, -0.1],
  [0.33, 0.06],
  [0.5, 0.0],
  [0.65, 0.16],
  [0.75, 0.34],
  [0.84, -0.04],
  [0.92, -0.16],
]);

export function sampleWalkMotion(seconds, strength = 1) {
  const amount = clamp01(strength);
  const phase = (Number(seconds) || 0) * Math.PI * WALK_STEP_RATE;
  const step = Math.sin(phase);
  const u = (((phase / (Math.PI * 2)) % 1) + 1) % 1;
  const kneeR = -KNEE_CURVE(u) * amount;
  const kneeL = -KNEE_CURVE((u + 0.5) % 1) * amount;
  const footR = ANKLE_CURVE(u) * amount;
  const footL = ANKLE_CURVE((u + 0.5) % 1) * amount;
  // 髋：前摆幅度略大于后摆，所以叠加一个二次项。
  // 幅度收到 ±0.44/±0.36（约 25°/21°）——过大时大腿会从裙摆正面穿出来。
  const hipR = (0.4 * step + 0.04 * step * step) * amount;
  const hipL = (-0.4 * step + 0.04 * step * step) * amount;
  return {
    // 重心始终偏向支撑腿：右腿支撑在 phase=π，所以取 -cos
    centerX: -Math.cos(phase) * 0.03 * amount,
    // 双腿支撑时最低，单腿支撑（phase=0/π）时最高
    centerY: Math.abs(Math.cos(phase)) * 0.032 * amount,
    bodyX: (-0.048 + Math.cos(phase) * 0.02) * amount,
    bodyZ: step * 0.035 * amount,
    // 肩带与骨盆反向旋转，且肩带慢半拍
    upperY: -Math.sin(phase - 0.3) * 0.12 * amount,
    lowerY: Math.sin(phase) * 0.09 * amount,
    // 头部反向补偿，走路时视线不该跟着身体一起晃
    headX: -Math.sin(phase + 0.5) * 0.02 * amount,
    headY: -Math.sin(phase - 0.4) * 0.022 * amount,
    legR: hipR,
    legL: hipL,
    legRZ: -step * 0.03 * amount,
    legLZ: step * 0.03 * amount,
    legRX: 0,
    legRY: 0,
    legLX: 0,
    legLY: 0,
    kneeR,
    kneeL,
    ankleR: 0,
    ankleL: 0,
    footR,
    footL,
    // 手臂与腿反相，且前摆幅度大于后摆（真人前屈比后伸大）；前摆时肘部收得更紧
    armR: (-0.34 * step + 0.05 * step * step) * amount,
    armL: (0.34 * step + 0.05 * step * step) * amount,
    elbowR: (0.2 - 0.16 * step) * amount,
    elbowL: (0.2 + 0.16 * step) * amount,
  };
}


const ACTIONS = [
  { id: "spin",   label: "张臂转圈", ms: 1440, sample: (p) => sampleSpinMotion(p) },
  { id: "stomp",  label: "跺脚",     ms: 1000, sample: (p) => sampleStompMotion(p) },
  { id: "touch",  label: "害羞摸脸", ms: 3600, sample: (p) => sampleTouchFaceMotion(p) },
  { id: "walk",   label: "走动",     ms: 4000, cycle: true, sample: (p) => sampleWalkMotion(p * (4 / 2.2), 1) },
  { id: "idle",   label: "自然待机", ms: 6000, cycle: true, sample: (p) => sampleIdleMotion(p * 6) },
];

// 旧曲线（改动前的实现），只保留画火柴人需要的通道
const OLD = {
  spin: (p) => {
    const q = Math.max(0, Math.min(1, p));
    const ss = (x) => { x = Math.max(0, Math.min(1, x)); return x*x*x*(x*(x*6-15)+10); };
    const eio = (x) => { x = Math.max(0, Math.min(1, x)); return x < 0.5 ? 4*x*x*x : 1 - ((-2*x+2)**3)/2; };
    const env = (x, a, r) => { x = Math.max(0, Math.min(1, x)); if (x<=0||x>=1) return 0; if (x<a) return ss(x/a); if (x<=r) return 1; return ss((1-x)/(1-r)); };
    if (q <= 0.1) { const k = ss(q/0.1); return { centerY: -0.08*k, bodyX: 0.045*k, legR: 0.12*k, kneeR: -0.18*k, footR: 0.04*k, legL: 0, kneeL: 0, footL: 0, armR: 0, armL: 0 }; }
    const tv = (q-0.1)/0.9, arc = Math.sin(tv*Math.PI);
    return { centerY: 0.38*arc, bodyX: 0.075*arc*Math.cos(tv*Math.PI*2), legR: 0.5*arc, kneeR: -0.92*arc, footR: 0.16*arc, legL: -0.06*arc, kneeL: 0, footL: 0.04*arc, armR: env(q,0.16,0.86), armL: -env(q,0.16,0.86) };
  },
  stomp: (p) => {
    const q = Math.max(0, Math.min(1, p));
    const rest = { centerY: 0, bodyX: 0, armR: 0, armL: 0, legR: 0, legL: 0, kneeR: 0, kneeL: 0, footR: 0, footL: 0, centerX: 0 };
    if (q <= 0 || q >= 1) return rest;
    const ss = (x) => { x = Math.max(0, Math.min(1, x)); return x*x*x*(x*(x*6-15)+10); };
    const mix = (a, b, t) => { const o = {}; for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) o[k] = (a[k]||0)*(1-t)+(b[k]||0)*t; return o; };
    const raised = { centerY: 0.08, centerX: 0.07, bodyX: 0.05, armR: 0.32, armL: -0.26, legR: 0.52, legL: 0.04, kneeR: -1.05, kneeL: 0.04, footR: 0.22, footL: 0.02 };
    const planted = { centerY: -0.1, centerX: -0.03, bodyX: -0.04, armR: -0.14, armL: 0.12, legR: 0.04, legL: -0.02, kneeR: -0.06, kneeL: 0.02, footR: 0.08, footL: -0.02 };
    const recoil = { centerY: 0.03, centerX: -0.02, bodyX: -0.02, armR: -0.06, armL: 0.05, legR: 0.02, legL: 0, kneeR: -0.03, kneeL: 0, footR: 0.03, footL: 0 };
    let pose;
    if (q < 0.26) pose = mix(rest, raised, ss(q/0.26));
    else if (q < 0.36) pose = {...raised};
    else if (q < 0.5) pose = mix(raised, planted, ss((q-0.36)/0.14));
    else if (q < 0.68) pose = mix(planted, recoil, ss((q-0.5)/0.18));
    else pose = mix(recoil, rest, ss((q-0.68)/0.32));
    let impact = 0;
    if (q >= 0.36 && q < 0.54) { impact = Math.sin(Math.PI*((q-0.36)/0.18)); pose.centerY -= 0.07*impact; }
    pose.impact = impact;
    return pose;
  },
  walk: (p, rate) => {
    const phase = p * (4 / 2.2) * Math.PI * 3.6;
    const step = Math.sin(phase);
    const liftR = Math.max(0, Math.cos(phase));
    const liftL = Math.max(0, -Math.cos(phase));
    return {
      centerY: Math.abs(Math.cos(phase))*0.03, centerX: Math.cos(phase)*0.028, bodyX: -0.045 + Math.cos(phase)*0.018,
      legR: step*0.58, legL: -step*0.58, kneeR: liftR*-0.92, kneeL: liftL*-0.92,
      footR: -step*0.12 - liftR*0.16, footL: step*0.12 - liftL*0.16,
      armR: -step*0.36, armL: step*0.36,
    };
  },
};

const S = 20;           // 模型单位 → 像素
const GROUND = 372;     // 地面
const { upper: THIGH, lower: SHIN } = getLegRig();
const FOOT = 1.1;
const HIP_Y = GROUND - (THIGH + SHIN) * S;  // 静止时脚底正好踩在地面
const TORSO = 3.9, NECK = 0.7, HEAD_R = 0.95;
const UPPER_ARM = 2.5, FOREARM = 2.4;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

let action = ACTIONS[0];
let playing = true;
let speed = 1;
let t = 0;              // 毫秒
let showGhost = true;
let showFloor = true;

const actionsEl = document.getElementById("actions");
ACTIONS.forEach((a) => {
  const b = document.createElement("button");
  b.textContent = a.label;
  b.onclick = () => { action = a; t = 0; render(); paintButtons(); };
  a.el = b;
  actionsEl.appendChild(b);
});
function paintButtons() { ACTIONS.forEach((a) => a.el.classList.toggle("on", a === action)); }
paintButtons();

document.getElementById("play").onclick = (e) => {
  playing = !playing;
  e.target.textContent = playing ? "暂停" : "播放";
};
document.querySelectorAll("[data-speed]").forEach((b) => {
  b.onclick = () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("[data-speed]").forEach((x) => x.classList.toggle("on", x === b));
  };
});
const seek = document.getElementById("seek");
seek.oninput = () => { t = (Number(seek.value) / 1000) * action.ms; playing = false; document.getElementById("play").textContent = "播放"; render(); };
document.getElementById("ghost").onchange = (e) => { showGhost = e.target.checked; render(); };
document.getElementById("floor").onchange = (e) => { showFloor = e.target.checked; render(); };

// 角度约定：向量 = (sin θ, -cos θ)，θ > 0 表示向前摆
function limb(x, y, theta, len) {
  return [x + Math.sin(theta) * len * S, y - Math.cos(theta) * len * S];
}
function leg(x, y, hip, knee, foot) {
  const [kx, ky] = limb(x, y, hip, THIGH);
  const [ax, ay] = limb(kx, ky, hip + knee, SHIN);
  const phi = -foot;
  const [tx, ty] = [ax + Math.cos(phi) * FOOT * S, ay + Math.sin(phi) * FOOT * S];
  return { knee: [kx, ky], ankle: [ax, ay], toe: [tx, ty] };
}
function arm(x, y, swing, elbow) {
  const tU = -swing;
  const [ex, ey] = limb(x, y, tU, UPPER_ARM);
  const [wx, wy] = limb(ex, ey, tU + elbow, FOREARM);
  return { elbow: [ex, ey], wrist: [wx, wy] };
}

function drawFigure(m, style) {
  const cx = W / 2 + (m.centerX || 0) * S;
  const hy = HIP_Y - (m.centerY || 0) * S;
  const lean = (m.bodyX || 0) + (m.breath || 0);
  const [sx, sy] = [cx + Math.sin(lean) * TORSO * S, hy - Math.cos(lean) * TORSO * S];
  const [nx, ny] = [sx + Math.sin(lean) * NECK * S, sy - Math.cos(lean) * NECK * S];

  ctx.save();
  ctx.globalAlpha = style.alpha;
  ctx.strokeStyle = style.color;
  ctx.fillStyle = style.color;
  ctx.lineWidth = style.width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  if (style.dash) ctx.setLineDash(style.dash);

  const legR = leg(cx, hy, m.legR || 0, m.kneeR || 0, m.footR || 0);
  const legL = leg(cx, hy, m.legL || 0, m.kneeL || 0, m.footL || 0);
  const armR = arm(sx, sy, -(m.armR || 0), (m.elbowR || 0) + (m.handWeight ? m.handWeight * 1.2 : 0));
  const armL = arm(sx, sy, m.armL || 0, (m.elbowL || 0) + (m.handWeight ? m.handWeight * 1.2 : 0));

  ctx.beginPath();
  ctx.moveTo(cx, hy); ctx.lineTo(legR.knee[0], legR.knee[1]); ctx.lineTo(legR.ankle[0], legR.ankle[1]); ctx.lineTo(legR.toe[0], legR.toe[1]);
  ctx.moveTo(cx, hy); ctx.lineTo(legL.knee[0], legL.knee[1]); ctx.lineTo(legL.ankle[0], legL.ankle[1]); ctx.lineTo(legL.toe[0], legL.toe[1]);
  ctx.moveTo(cx, hy); ctx.lineTo(sx, sy); ctx.lineTo(nx, ny);
  ctx.moveTo(sx, sy); ctx.lineTo(armR.elbow[0], armR.elbow[1]); ctx.lineTo(armR.wrist[0], armR.wrist[1]);
  ctx.moveTo(sx, sy); ctx.lineTo(armL.elbow[0], armL.elbow[1]); ctx.lineTo(armL.wrist[0], armL.wrist[1]);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(nx + Math.sin(lean + (m.headX || 0)) * HEAD_R * S * 0.8, ny - Math.cos(lean + (m.headX || 0)) * HEAD_R * S * 0.8, HEAD_R * S, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  if (showFloor && !style.dash) {
    ctx.save();
    ctx.strokeStyle = "#f0a13c";
    ctx.globalAlpha = 0.65;
    ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.moveTo(cx, GROUND + 6); ctx.lineTo(cx, H - 6); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#f0a13c";
    ctx.beginPath(); ctx.arc(cx, GROUND + 6, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0b0e14";
  ctx.fillRect(0, 0, W, H);

  if (showFloor) {
    ctx.strokeStyle = "#1e2836";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(20, GROUND + 6); ctx.lineTo(W - 20, GROUND + 6); ctx.stroke();
  }

  const p = action.cycle ? ((t / action.ms) % 1) : Math.max(0, Math.min(1, t / action.ms));
  const m = action.sample(p);
  if (showGhost && OLD[action.id]) {
    drawFigure(OLD[action.id](p), { color: "#5d6b7f", width: 3, alpha: 0.55, dash: [5, 4] });
  }
  drawFigure(m, { color: "#5aa9ff", width: 4.5, alpha: 1 });

  // 冲击提示
  if (m.impact > 0.05) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, m.impact);
    ctx.strokeStyle = "#ff6b6b";
    ctx.lineWidth = 2;
    const r = 12 + 26 * (1 - m.impact);
    ctx.beginPath(); ctx.arc(W / 2, GROUND + 6, r, Math.PI, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  if (playing) seek.value = String(Math.round(p * 1000));
  document.getElementById("seekVal").textContent = Math.round(p * 100) + "%";

  const keys = ["centerY", "centerX", "bodyX", "legR", "kneeR", "footR", "legL", "kneeL", "footL", "armR", "armL", "elbowR", "handWeight", "turns", "impact", "weight"];
  document.getElementById("readout").innerHTML = keys
    .filter((k) => m[k] !== undefined)
    .map((k) => k.padEnd(11, " ") + (m[k] >= 0 ? " " : "") + m[k].toFixed(3))
    .join("\n");
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(64, now - last);
  last = now;
  if (playing) {
    t += dt * speed;
    if (!action.cycle && t >= action.ms) t = 0;
    if (action.cycle) t %= action.ms;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
